[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page Analyzer — SEO analysis web application"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask",
    "gunicorn",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]
